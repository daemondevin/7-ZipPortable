[7-ZipPortable]
AdditionalParameters=
RunLocally=false
FileAssociations=true
ShellExtension=false
UpdateCheck=true
Architecture=auto
Banner=false

# Banner=
; Enable or disable the initialization banner.

# FileAssociations=
; Turn the "Open with" entries for archives on or off (true|false).
; Everything is removed again when 7-Zip closes.

# ShellExtension= (true, false, auto)
; Add the 7-Zip menu to Explorer's context menu while 7-Zip runs. It is
; registered for the current user only and needs no administrator rights.
; auto adds it only when no installed 7-Zip already provides it.
; Explorer keeps the menu's DLL loaded for a while after 7-Zip closes, so
; Windows may refuse to eject a USB drive until it lets go.

# UpdateCheck=
; Check for a new 7-Zip at start and offer to update all three builds.

# Architecture= (auto, x86, x64, arm64)
; Which build to run. auto picks the one that runs natively, ARM64 included.

# AdditionalParameters=
; Pass additional command-line switches.

# RunLocally=
; Application is copied to & executed from $TEMP directory.
