[Launch]
ProgramExecutable=7-Zip\7zFM.exe
ProgramExecutable64=7-Zip64\7zFM.exe
ProgramExecutableARM64=7-ZipARM64\7zFM.exe
ProgramExecutableWhenParameters=7-Zip\7zG.exe
ProgramExecutableWhenParameters64=7-Zip64\7zG.exe
ProgramExecutableWhenParametersARM64=7-ZipARM64\7zG.exe
WorkingDirectory=%PAL:ProgramDir%
WaitForEXE1=7zG.exe
SinglePortableAppInstance=false
RefreshShellIcons=both
DirectoryMoveOK=yes
SupportsUNC=yes

[Activate]
Registry=true
DualMode=7-ZIP
FileAssociations=true

; Open with entries for archives. Windows keeps its own default for each
; type (IfExists=skip), so a type that already has a handler (.zip, for
; example) only gains an "Open with" entry. One section per icon in 7z.dll.
; Everything goes again when 7-Zip closes. The command opens 7-Zip File
; Manager directly: these entries only exist while the session runs, and the
; launcher would hand a bare file name to 7zG.exe, which needs a command.

[FileAssociation1]
Extension=.7z
ProgID=7-ZipPortable.7z
Description=7Z Archive
DefaultIcon=%PAL:ProgramDir%\7z.dll,0
OpenCommand="%PAL:ProgramDir%\7zFM.exe" "%1"
IfExists=skip

[FileAssociation2]
Extension=.zip
ProgID=7-ZipPortable.zip
Description=ZIP Archive
DefaultIcon=%PAL:ProgramDir%\7z.dll,1
OpenCommand="%PAL:ProgramDir%\7zFM.exe" "%1"
IfExists=skip

