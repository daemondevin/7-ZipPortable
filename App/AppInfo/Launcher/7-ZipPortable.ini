; 7-Zip keeps its settings under HKCU\Software\7-Zip; they live in
; Data\settings\7-Zip.reg between sessions.
[RegistryKeys]
7-Zip=HKCU\Software\7-Zip

[RegistryValueWrite]
HKCU\SOFTWARE\7-Zip\Path=REG_SZ:%PAL:ProgramDir%\
HKCU\SOFTWARE\7-Zip\Path64=REG_SZ:%PAL:ProgramDir%\

[FileWrite1]
Type=Replace
File=%PAL:DataDir%\settings\7-Zip.reg
Find="="%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%
Replace="="%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\settings\7-Zip.reg
Find="="%PAL:LastDrive%\\
Replace="="%PAL:Drive%\\
